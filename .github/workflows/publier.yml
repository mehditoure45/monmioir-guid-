# Publie le dossier site/ sur la branche gh-pages à chaque mise à jour de main.
name: Publier le site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier site/ sur gh-pages
        run: |
          cd site
          touch .nojekyll
          echo "guide.monmiroir.net" > CNAME
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
      - name: Prévenir Bing et les moteurs IndexNow des pages publiées
        run: |
          sleep 60
          KEY=$(ls site | grep -E '^[0-9a-f]{32}.txt$' | sed 's/.txt$//' | head -1)
          URLS=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | sed 's/.*/"&"/' | paste -sd, -)
          curl -s -o /dev/null -w "IndexNow : %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"guide.monmiroir.net\",\"key\":\"$KEY\",\"keyLocation\":\"https://guide.monmiroir.net/$KEY.txt\",\"urlList\":[$URLS]}"
