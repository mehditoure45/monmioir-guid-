# Publie le dossier site/ sur la branche gh-pages à chaque mise à jour de main.
name: Publier le site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier site/ sur gh-pages
        run: |
          cd site
          touch .nojekyll
          echo "guide.monmiroir.net" > CNAME
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
